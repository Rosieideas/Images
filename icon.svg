<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4aeadc" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0891b2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0c1929" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="swirlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4aeadc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a4c"/>
      <stop offset="50%" stop-color="#0f2937"/>
      <stop offset="100%" stop-color="#071521"/>
    </linearGradient>
    <linearGradient id="baseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#4aeadc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="magentaStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Outer glow -->
  <circle cx="50" cy="42" r="38" fill="#22d3ee" fill-opacity="0.15"/>
  
  <!-- Main crystal ball -->
  <circle cx="50" cy="42" r="32" fill="url(#orbGlow)" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.6"/>
  
  <!-- Swirl effects -->
  <path d="M28 42 Q35 30 50 35 Q65 40 55 52 Q45 64 35 55 Q25 46 28 42" fill="none" stroke="url(#swirlGradient)" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M72 42 Q65 54 50 49 Q35 44 45 32 Q55 20 65 29 Q75 38 72 42" fill="none" stroke="url(#swirlGradient)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Inner glow ring -->
  <circle cx="50" cy="42" r="28" fill="none" stroke="#4aeadc" stroke-width="0.5" stroke-opacity="0.3"/>
  
  <!-- Shine/reflection -->
  <ellipse cx="38" cy="28" rx="12" ry="8" fill="url(#shine)"/>
  <circle cx="62" cy="30" r="3" fill="white" fill-opacity="0.2"/>
  
  <!-- 4-pointed AI Star 1 -->
  <path d="M42 36 L44 28 L46 36 L54 38 L46 40 L44 48 L42 40 L34 38 Z" fill="url(#magentaStar)"/>
  <circle cx="44" cy="38" r="2" fill="white" fill-opacity="0.9"/>
  
  <!-- 4-pointed AI Star 2 -->
  <path d="M54 46 L55.5 40 L57 46 L63 47.5 L57 49 L55.5 55 L54 49 L48 47.5 Z" fill="url(#magentaStar)"/>
  <circle cx="55.5" cy="47.5" r="1.5" fill="white" fill-opacity="0.9"/>
  
  <!-- Sparkle particles -->
  <circle cx="35" cy="50" r="1" fill="#4aeadc" fill-opacity="0.4"/>
  <circle cx="65" cy="35" r="0.8" fill="#4aeadc" fill-opacity="0.3"/>
  <circle cx="58" cy="58" r="0.6" fill="#d946ef" fill-opacity="0.3"/>
  
  <!-- Base/pedestal -->
  <path d="M30 74 L35 70 L65 70 L70 74 L70 78 L65 82 L35 82 L30 78 Z" fill="url(#baseGradient)" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.6"/>
  <ellipse cx="50" cy="70" rx="18" ry="4" fill="url(#baseGradient)" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.4"/>
  
  <!-- Geometric accent lines -->
  <path d="M33 76 L38 73 L62 73 L67 76" fill="none" stroke="url(#baseGlow)" stroke-width="1.5"/>
  <path d="M35 80 L40 78 L60 78 L65 80" fill="none" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.4"/>
  <path d="M32 75 L28 77 L32 79" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.5"/>
  <path d="M68 75 L72 77 L68 79" fill="none" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.5"/>
  <path d="M30 82 Q50 86 70 82" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.6"/>
</svg>
